# G7 Guinchos — site estático + proxy do chat 24h
#
# Por que o proxy existe: o site roda em https:// e o n8n só tem http:// válido.
# Navegador bloqueia https -> http (mixed content). Com o proxy, o browser fala
# só com a mesma origem (/api/chat) e quem conversa com o n8n é o nginx.
# De quebra, mata o CORS e esconde a URL do n8n.

limit_req_zone $binary_remote_addr zone=chat:10m rate=12r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;   # não anuncia a versão do nginx

  # reforço de segurança (audit 17/08). Sem CSP: o site usa script/estilo inline (o chat).
  add_header X-Frame-Options "DENY" always;                      # ninguém embute o site em iframe
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=15552000" always; # 6 meses, sem preload (reversível)

  gzip on;
  gzip_types text/css application/json image/svg+xml;   # text/html já vem por padrão
  gzip_min_length 1024;

  location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # cérebro do atendimento 24h (n8n + DeepSeek)
  location = /api/chat {
    limit_req zone=chat burst=4 nodelay;   # saldo DeepSeek é pré-pago: ninguém queima em loop
    limit_req_status 429;
    client_max_body_size 8k;

    proxy_pass http://n8n-vohw7zmrcsdnogchh93sbaqm.169.58.179.229.sslip.io/webhook/g7-atendimento;
    proxy_set_header Host n8n-vohw7zmrcsdnogchh93sbaqm.169.58.179.229.sslip.io;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 45s;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
